<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting — AuditPilot</title>
  <script>
    // GitHub Pages SPA router redirect: preserve path, query, and hash
    (function() {
      var path = window.location.pathname || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      
      // Clean leading and trailing slashes
      var segment = path.replace(/^\/+|\/+$/g, '');
      
      if (segment && !segment.endsWith('.html') && !segment.includes('.')) {
        // Direct route like /app/dashboard or /dashboard -> redirect to /#/app/dashboard
        var targetHash = segment.startsWith('app') ? '#/' + segment : '#/' + segment;
        window.location.replace('/' + targetHash + (search ? '?' + search.slice(1) : '') + (hash ? hash : ''));
      } else {
        window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 4rem 1rem; color: #334155;">
  <p>Loading agency workspace... <a href="/" style="color: #2563EB;">Click here if not redirected</a>.</p>
</body>
</html>
